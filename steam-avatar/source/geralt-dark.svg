      <stop offset="40%" stop-color="#66290c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#66290c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolG" cx="90%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#2c3d52" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2c3d52" stop-opacity="0"/>
