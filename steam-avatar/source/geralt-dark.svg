<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgR" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#191209"/>
      <stop offset="55%" stop-color="#0d0805"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="emberG" cx="14%" cy="92%" r="65%">
