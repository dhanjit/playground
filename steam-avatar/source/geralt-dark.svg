      <stop offset="100%" stop-color="#100b06"/>
    </linearGradient>
    <linearGradient id="shadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="42%" stop-color="#080503" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080503" stop-opacity="0.78"/>
