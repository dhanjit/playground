      <stop offset="35%" stop-color="#f6cd60"/>
      <stop offset="70%" stop-color="#dd9926"/>
      <stop offset="100%" stop-color="#a86a10"/>
    </radialGradient>
    <linearGradient id="silG" x1="0" y1="0" x2="0" y2="1">
